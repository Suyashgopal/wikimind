services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wikimind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wikimind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wikimind-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wikimind"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: wikimind-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DB_URL: jdbc:postgresql://postgres:5432/wikimind
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  wikimind-pgdata:
