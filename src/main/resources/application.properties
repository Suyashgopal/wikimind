spring.application.name=wikimind

# ================================
# Google Gemini (chat + embeddings)
# ================================
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# Google retires models on a schedule (text-embedding-004 and gemini-2.5-flash already 404 for new keys),
# so the names can be overridden from the environment without a code change.
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash}

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
# Must match vector(768) on WikiDocument; gemini-embedding-001 defaults to 3072 dimensions
spring.ai.google.genai.embedding.text.options.dimensions=768

# Applies to both chat and embedding calls; retries cover 408/429/5xx
wikimind.ai.timeout-ms=20000
wikimind.ai.max-attempts=3

# ================================
# JWT (secret must be at least 32 characters)
# ================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ================================
# PostgreSQL / PGVector connection
# ================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wikimind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
